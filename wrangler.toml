name = "rookar"
main = "server/worker.ts"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[vars]
AI_PROVIDER = "opencode"
OPENAI_MODEL = "deepseek-v4.1-flash"
OPENAI_BASE_URL = "https://opencode.ai/inference/go/v1"
OPENAI_USER_AGENT = "rookar-agent/1.0"

[[d1_databases]]
binding = "DB"
database_name = "rookar_db"
database_id = "f9c8cc02-55ec-4c06-a6f7-cfcae2047692"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rookar-private"

[triggers]
crons = ["0 3 * * *"]
